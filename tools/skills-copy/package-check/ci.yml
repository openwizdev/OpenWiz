name: WizSkills check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skill rules, standalone check and every skill's suites
        run: python3 check/run.py
