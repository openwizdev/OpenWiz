<svg xmlns="http://www.w3.org/2000/svg" width="820" height="970" viewBox="0 0 820 970" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#f0f6fc" role="img">
<title>Daily CI metrics</title>
<rect width="820" height="970" fill="#0d1117"/>
<text x="0.0" y="22.0" font-size="18" fill="#f0f6fc" font-weight="600">Daily CI metrics</text>
