<polyline points="457.0,328.8 742.0,249.6" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="0.0" y="914.0" font-size="12" fill="#7d8590">Minutes: workflow created → last job done (push-to-result proxy); one successful code run per PR assumed.</text>
<text x="0.0" y="932.0" font-size="12" fill="#7d8590">Capacity assumes 5 robots; not a verified historic fleet size. Unknown days break the lines.</text>
<text x="0.0" y="950.0" font-size="12" fill="#7d8590">USD/merged PR: all window CI spend ÷ merges; USD/code run: successful code-run spend only.</text>
