<text class="hero" x="0.0" y="134.0" font-size="52" fill="#f0f6fc" font-weight="600">1.5</text>
<text x="105.0" y="134.0" font-size="18" fill="#9198a1">min</text>
<text x="0" y="160" font-size="13" fill="#9198a1">Wed Jan 2 · same as Tue</text>
<text x="0.0" y="180.0" font-size="13" fill="#9198a1">Tonight's goal: under 10 · met</text>
