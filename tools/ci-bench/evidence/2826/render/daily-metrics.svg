<text x="742.0" y="428.0" font-size="12" fill="#9198a1" text-anchor="middle">Wed Jan 2</text>
<g class="cost-point"><title>2030-01-02: $0.0132</title><circle cx="742.0" cy="249.6" r="4" fill="#3987e5"/></g>
