<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenWiz demo</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font: 18px/1.5 "Iowan Old Style", Palatino, Georgia, serif;
      background: #f6f3ea;
      color: #1c1a16;
    }
    main { max-width: 38rem; margin: 0 auto; padding: 48px 24px 80px; }
    p.kicker { letter-spacing: 0.14em; text-transform: uppercase; font: 600 12px/1.2 system-ui, sans-serif; color: #2b2bff; }
    h1 { font-size: 42px; line-height: 1.1; margin: 8px 0 16px; }
    button, input {
      font: 16px/1.2 system-ui, sans-serif;
      border-radius: 999px;
      border: 1px solid #1c1a16;
    }
    button { background: #2b2bff; color: white; padding: 10px 18px; cursor: pointer; }
    input { padding: 10px 14px; min-width: 16rem; background: white; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }
    #status { font: 15px/1.4 system-ui, sans-serif; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">OpenWiz 🧙‍♂️🪄</p>
    <h1>Synthetic desk</h1>
    <p>The synthetic lantern hangs above the desk. It is only a fixture.</p>
    <div class="row">
      <button id="demo" type="button">Demo</button>
      <input id="note" type="text" placeholder="A note">
    </div>
    <p id="status">Waiting</p>
  </main>
  <script>
    document.getElementById("demo").addEventListener("click", () => {
      document.getElementById("status").textContent = "Demo was clicked.";
    });
  </script>
</body>
</html>
