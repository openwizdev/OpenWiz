[package]
name = "openwiz-terminal"
description = "The visual terminal app: a thin client of the running local openwiz-server, never a backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "openwiz-terminal"
path = "src/main.rs"

# The approved visual-only pair (grill C3, spec #1092). No other crate in the
# workspace may depend on either, nor on this crate as a normal dependency.
[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
serde.workspace = true
serde_json.workspace = true
# Only for shared OpenWiz words (the send mode); no I/O.
openwiz-core = { path = "../core" }

[lints]
workspace = true
