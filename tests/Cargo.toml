[package]
name = "openwiz-tests"
description = "Cross-crate proof tests, synthetic fixtures and the fake room-cli. Never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autotests = false
autoexamples = false
autobenches = false

[[bin]]
name = "fake-room-cli"
path = "fake-room-cli/main.rs"
test = false

[[bin]]
name = "fake-gh"
path = "fake-gh/main.rs"
test = false

[[example]]
name = "openwiz"
path = "fixture-entrypoints/cli.rs"
test = false

[[test]]
name = "proof"
path = "proof/main.rs"

[[test]]
name = "checks"
path = "checks/main.rs"

[[test]]
name = "messaging"
path = "messaging/main.rs"

[[test]]
name = "new-thread"
path = "new-thread/main.rs"

[[test]]
name = "fleet"
path = "fleet/main.rs"

[[test]]
name = "loops"
path = "loops/main.rs"

[[test]]
name = "cli-agent"
path = "cli-agent/main.rs"

[dependencies]
serde_json.workspace = true
openwiz-core = { path = "../crates/core" }
openwiz-adapter-cloudroom = { path = "../crates/adapters/cloudroom" }
openwiz-adapter-github = { path = "../crates/adapters/github" }
openwiz-cli = { path = "../crates/cli" }

[dev-dependencies]
serde.workspace = true

[lints]
workspace = true
