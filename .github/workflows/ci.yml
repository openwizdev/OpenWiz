      - name: Save the GitHub npm cache
        if: steps.guard.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Record passed lane
        run: python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" site "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-site-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  # #743: the release proofs split across this many members by measured
  # time (ci/shard/lanes.py, ci/shard/lanes.tsv), a setting per runner kind
  # as for the Rust lane: a kind not named runs one, so a paid runner never
  # fans out. The ci job checks every unit ran exactly once, then stamps.
  release:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.release == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 21
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(fromJSON('{"ubuntu-24.04":"[1,2,3]"}')[github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04'] || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Prune unused inputs
        run: sh .github/actions/docs-only/prune.sh .github/actions/docs-only/ci-reads.txt release
      - name: Prepare lane
        uses: ./.github/actions/docs-only/setup
        with:
          hosted: ${{ steps.guard.outputs.hosted }}
          save: ${{ steps.guard.outputs.save }}
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cargo: 'true'
          cache: cargo-web-test
          npm: 'true'
          browser: 'true'
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - name: The release proofs
        env:
          SHARDS: ${{ strategy.job-total }}
          SHARD: ${{ matrix.shard }}
        run: python3 -I .github/actions/docs-only/run.py execute "$RUNNER_TEMP/ci-plan" release --shard "$SHARD/$SHARDS" "$RUNNER_TEMP/shard-ran/release-$SHARD.json"
      - name: Save the npm cache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && strategy.job-index == 0
        run: sh ci/runner/cache.sh save npm "$HOME/.npm"
      - name: Save the GitHub npm cache
        if: steps.guard.outputs.save == 'true' && strategy.job-index == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      # Only once its share passed: the ci job checks these records.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-ran-${{ github.run_attempt }}-release-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-ran/release-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  # Every selected skill suite but launch-fleet's (its own job, below).
  skills:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.skill-jobs != '[]' && needs.changes.outputs.skill-jobs != '' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.changes.outputs.skill-jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Prune unused inputs
        run: sh .github/actions/docs-only/prune.sh .github/actions/docs-only/ci-reads.txt rust
      - name: Prepare lane
        uses: ./.github/actions/docs-only/setup
        with:
          hosted: ${{ steps.guard.outputs.hosted }}
          save: ${{ steps.guard.outputs.save }}
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cargo: 'false'
          npm: ${{ matrix.skill == 'image' }}
          browser: ${{ matrix.skill == 'image' }}
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - name: The skills' tests
        run: python3 -I .github/actions/docs-only/run.py execute "$RUNNER_TEMP/ci-plan" skill:${{ matrix.skill }}
      - name: Record passed lane
        run: python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" skill:${{ matrix.skill }} "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-skill-${{ matrix.skill }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  # #743: launch-fleet's suites split across members by measured time, its
  # test.sh by group (TEST_SHARD), a setting per runner kind as for release.
  # The ci job checks every unit ran once and the case counts add up.
  launch-fleet:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(needs.changes.outputs.skills, '"launch-fleet"') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(fromJSON('{"ubuntu-24.04":"[1,2,3,4]"}')[github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04'] || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Prune unused inputs
        run: sh .github/actions/docs-only/prune.sh .github/actions/docs-only/ci-reads.txt rust
      - name: Prepare lane
        uses: ./.github/actions/docs-only/setup
        with:
          hosted: ${{ steps.guard.outputs.hosted }}
          save: ${{ steps.guard.outputs.save }}
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cargo: 'false'
          npm: 'false'
          browser: 'false'
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - name: The launch-fleet tests
        env:
          SHARDS: ${{ strategy.job-total }}
          SHARD: ${{ matrix.shard }}
        run: python3 -I .github/actions/docs-only/run.py execute "$RUNNER_TEMP/ci-plan" skill:launch-fleet --shard "$SHARD/$SHARDS" "$RUNNER_TEMP/shard-ran/launch-fleet-$SHARD.json"
      # Only once its share passed: the ci job checks these records.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-ran-${{ github.run_attempt }}-launch-fleet-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-ran/launch-fleet-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  # The next map (#432): after a traced run whose three jobs all passed, the
  # records each traced job kept become one map (map.py, which refuses a map
  # missing any test). A push or the nightly run on main signs it (GitHub's
  # OIDC token, bound to the map's bytes) and keeps both in GitHub's cache,
  # where web-build's selector finds the newest; any run keeps them as an
  # artifact too (a PR that changes the tracer: its proof map). Not a
  # required check: without it, pull requests run every test.
  select-map:
    needs: [changes, ci]
    # Its failure never fails the run: main's and the nightly's results are
    # the three required jobs'. A failed select-map only means no new map.
    continue-on-error: true
    if: ${{ !cancelled() && needs.changes.outputs.trace == 'true' && needs.ci.result == 'success' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_SMALL_RUNS_ON || vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      # The runner guard (#1265), before anything the change ships runs: a
      # fork's pull request fails off GitHub's runners, and whether this job
      # may save GitHub's cache (ci/hosted/guard.sh).
      - name: The runner guard
        id: guard
        working-directory: .
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: select-records-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/select-records
      - name: Save the select-map cache
        id: map
        env:
          MAIN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        run: |
          dir="$HOME/.cache/closedwiz-ci-select"
          mkdir -p "$dir"
          python3 -I ci/select/map.py "$dir/map.json" --commit "$GITHUB_SHA" --root . "$RUNNER_TEMP/select-records"
          if [ "$MAIN" = true ]; then
            python3 -I ci/select/job.py sign "$dir/map.json" "$dir/map.jwt"
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-select-map
          path: ~/.cache/closedwiz-ci-select
          if-no-files-found: error
          retention-days: 30
      - name: Save the select-map GitHub cache
        if: steps.map.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/closedwiz-ci-select
          key: ci-select-map-${{ github.run_id }}-${{ github.run_attempt }}

  ci:
    needs: [changes, always, web-build, rust, rust-export, web, web-export, site, release, skills, launch-fleet]
    if: ${{ always() && (github.event_name != 'push' || needs.changes.result != 'success' || needs.changes.outputs.trace == 'true') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_SMALL_RUNS_ON || vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lane-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.rust.result == 'success' || needs.rust-export.result == 'success'
        with:
          pattern: rust-ran-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/rust-ran
      # #1266: the Rust lane's shards, counted. Each member that passed left
      # its share; together they must hold every selected Rust test exactly
      # once, and only then is the Rust lane's receipt written.
      - name: Every Rust test ran exactly once
        if: needs.rust.result == 'success' || needs.rust-export.result == 'success'
        run: |
          python3 -I ci/shard/shard.py check "$RUNNER_TEMP/ci-plan/ci-selection.json" "$RUNNER_TEMP"/rust-ran/ran-*.txt
          python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" rust "$RUNNER_TEMP/receipts"
      # #743: the same for the release and launch-fleet lanes' members: every
      # unit exactly once, and each counted script's shard case counts summed
      # to its total, before the lane's receipt is written.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.release.result == 'success' || needs.launch-fleet.result == 'success'
        with:
          pattern: shard-ran-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/shard-ran
      - name: Every release unit ran exactly once
        if: needs.release.result == 'success'
        run: |
          python3 -I .github/actions/docs-only/run.py check-shards "$RUNNER_TEMP/ci-plan" release "$RUNNER_TEMP"/shard-ran/release-*.json
          python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" release "$RUNNER_TEMP/receipts"
      - name: Every launch-fleet case ran exactly once
        if: needs.launch-fleet.result == 'success'
        run: |
          python3 -I .github/actions/docs-only/run.py check-shards "$RUNNER_TEMP/ci-plan" skill:launch-fleet "$RUNNER_TEMP"/shard-ran/launch-fleet-*.json
          python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" skill:launch-fleet "$RUNNER_TEMP/receipts"
      - name: Every planned lane passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          python3 -I .github/actions/docs-only/run.py finish "$RUNNER_TEMP/ci-plan" "$RUNNER_TEMP/needs.json" "$RUNNER_TEMP/receipts"
      # C7 shadow evidence: finish is not terminal ci or complete coverage.
      - name: Preserve incomplete combined-main evidence
        id: main_shadow
        continue-on-error: true
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))
        run: |
          mkdir -p "$RUNNER_TEMP/main-shadow"
          python3 -I ci/main-batch/shadow.py capture "$RUNNER_TEMP/ci-plan" "$RUNNER_TEMP/needs.json" "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/main-shadow/observation.json"
      - name: Keep the incomplete combined-main evidence
        continue-on-error: true
        if: success() && steps.main_shadow.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-shadow-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-shadow/observation.json
          if-no-files-found: error
          retention-days: 30

  # Transition bridge: the ruleset still names web-test until the orchestrator
  # switches it at merge. It follows ci so that this PR can satisfy that old
  # name without letting any new lane failure through the old ruleset.
  web-test:
    needs: ci
    if: ${{ always() && (github.event_name != 'push' || needs.ci.result != 'skipped') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_SMALL_RUNS_ON || vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Legacy checks follow ci
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = success

  # #744: the light check on a push to main: format only. privacy.yml checks
  # main on every push; an admitted old-map push also traces and signs (#1055).
  main-light:
    if: github.event_name == 'push'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_SMALL_RUNS_ON || vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Format
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --no-self-update
          rustup default "$RUST_VERSION"
          cargo fmt --check
