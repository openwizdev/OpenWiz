# CI (#1777): plain jobs that build and test the kept parts (the kernel, the
# drivers, the `openwiz` command, the installer, the release package), the
# owned-paths gate, and the required `ci` check over all of them. `privacy`
# is its own workflow (privacy.yml). `web-test` is the old required name; it
# follows `ci`.
name: CI

on:
  pull_request:
    branches: [main, 'release-*']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The merge queue (#190): GitHub re-tests each pull request on top of the
  # latest main just before it lands, and merges it only if `ci` passes there.
  merge_group:
    types: [checks_requested]
    branches: [main]
  # Every merge to main, which also saves the Cargo caches pull requests read.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  RUST_VERSION: 1.99.1
  NODE_VERSION: 24.22.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:

  # Format, lint, the workspace and release builds, and every crate's own
  # tests (all but openwiz-tests'): apart from the rust job's targets, so the
  # two never compete for one runner's CPUs (#1777).
  lint:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare
        uses: ./.github/actions/docs-only/setup
        with:
          cache: cargo-lint
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo build --release --locked
      - run: cargo test --workspace --exclude openwiz-tests --locked -- --test-threads=8
      - name: Save the Cargo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-lint-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  # The openwiz-tests targets (the proofs, checks and CLI tests), at once
  # where the runner has room (ci/rust-tests.sh); lint runs the crates' own.
  rust:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare
        uses: ./.github/actions/docs-only/setup
        with:
          cache: cargo-rust
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # Tests run the workspace's debug binaries (tests/loops' target/debug/openwiz).
      - run: cargo build --workspace --bins --locked
      - run: sh ci/rust-tests.sh --targets-only
      - name: Save the Cargo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  # The kernel kits, the installers, the release package and the GitHub App's
  # Python proofs, in two parts of about equal time.
  release:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare
        uses: ./.github/actions/docs-only/setup
        with:
          cache: cargo-release
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: The release proofs
        if: matrix.part == 1
        run: python3 tools/release/test.py
      - name: The kernel kits' tests
        if: matrix.part == 2
        run: |
          python3 -I kernel/records-kit/test_check.py
          python3 -I kernel/driver-kit/test_kit.py
          python3 -I kernel/driver-kit/test_hostkey.py
          env -u OPENWIZ_GITHUB_APP_KEY python3 -I kernel/driver-kit/test_stubs.py
          python3 -I adapters/local/test_driver.py
          python3 -I adapters/local/test_harnesses.py
          python3 -I adapters/boat/test_driver.py
          python3 -I kernel/records/model/test_model.py
          python3 -I adapters/template/test_driver.py
          python3 -I adapters/cloudroom/test_driver.py
          python3 -I adapters/devin/test_driver.py
          python3 -I adapters/openclaw/test_driver.py
          python3 -I adapters/pane/test_driver.py
          python3 -I contracts/fixtures/feedback-loop/test_check.py
          python3 -I tools/bench/first-fleet/test_bench.py
          python3 -I tools/ci-overload/test_supply.py
      - name: The live-check rig's tests
        if: matrix.part == 2
        run: |
          stubs=$(mktemp -d)
          for cli in claude codex cursor-agent agent pi opencode copilot goose gemini kimi qwen cline kilo crush \
              vibe auggie kiro-cli junie amp agy oz sculpt hermes acpx droid; do
            printf '#!/bin/sh\necho "%s: refused, CI never starts an agent CLI" >&2\nexit 1\n' "$cli" > "$stubs/$cli"
            chmod +x "$stubs/$cli"
          done
          for test in kernel/live-rig/test_*.py kernel/live-rig/*/test_*.py; do
            if [ -e "$test" ]; then PATH="$stubs:$PATH" env -u OPENWIZ_GITHUB_APP_KEY python3 -I "$test"; fi
          done
      # #555: fail on any carried contract that differs from the pinned
      # WizSkills release by one byte.
      - name: The WizSkills installer
        if: matrix.part == 2
        run: |
          python3 -I tools/wizskills/check_contracts.py
          python3 -I tools/wizskills/test_install.py
          python3 -I tools/wizskills/test_contract.py
      - name: The release package
        if: matrix.part == 2
        run: |
          cargo build --locked --jobs 2 -p openwiz-cli --bins
          python3 -I tools/release/test_package.py
          python3 -I tools/release/test_product_identity.py
      - name: The installer
        if: matrix.part == 2
        run: |
          python3 -I tools/install/test_install.py
          python3 -I tools/install/test_pull.py
          python3 -I tools/install/tests/public-release-security/baseline/test_baseline.py
          python3 -I tools/install/tests/public-release-security/test_candidate.py
          python3 -I tools/install/tests/setup-onboard-contract/test_contract.py
          python3 -I tools/install/tests/init/test_init.py
          python3 -I -B tools/install/setup/test_github_login.py
          python3 -I tools/install/tests/skills-linked-config/test_linked_config.py
          python3 -I tools/rehearsal/test_rehearse.py
      - name: The GitHub App
        if: matrix.part == 2
        run: |
          python3 -I tools/github-app/test.py
          python3 -I contracts/fixtures/token-service/test_fixtures.py
          python3 -I tools/github-app/test_agent_token.py
          python3 -I tools/github-app/test_token_service.py
          python3 -I tools/github-app/test_app_select.py
      - name: The importer and skills-eval tests
        if: matrix.part == 2
        run: |
          python3 -I tools/open-import/test_import.py
          python3 -I tools/skills-eval/test.py
      - name: Save the Cargo cache
        if: github.event_name == 'push' && matrix.part == 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  # #1418: a pull request's changed files must sit inside its linked ticket's
  # owned paths, the fleet's standing supporting edits or a record author's F4
  # grant (tools/owned-paths/README.md). It reads GitHub only through GraphQL,
  # with this workflow's own read token. A pull request that links no ticket
  # passes with a note.
  owned-paths:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        run: sh .github/actions/docs-only/python.sh
      - name: The comment check (#1817)
        run: |
          python3 -I tools/comment-check/test_check.py
          python3 -I docs/evidence/1817/test_ci_step.py
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          python3 -I tools/comment-check/check.py diff --base HEAD^1
      - name: The owned-paths tests
        run: python3 -I tools/owned-paths/test_check.py
      - name: Every changed file is inside the ticket's owned paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -I tools/owned-paths/check.py --repo "$GITHUB_REPOSITORY" --pr "$PR"

  # The required check: a draft fails it, and so does any job above that did
  # not pass (owned-paths runs on pull requests only).
  ci:
    needs: [lint, rust, release, owned-paths]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          DRAFT: ${{ github.event.pull_request.draft == true }}
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "$DRAFT" = true ]; then echo "ci: a draft pull request; mark it ready to run CI" >&2; exit 1; fi
          printf '%s' "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries | all(.value.result == "success"
              or (.key == "owned-paths" and $event != "pull_request" and .value.result == "skipped"))' > /dev/null || {
            printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >&2
            echo "ci: a job did not pass" >&2
            exit 1
          }
          echo "ci: every job passed"

  # The ruleset's older required name, which follows ci.
  web-test:
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Follows ci
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = success
