# X5: changes writes one plan; independent lanes read it; ci checks every expected result.
# X7 fork routing, pinned setup and trusted caches apply to every executing lane.
name: CI

on:
  pull_request:
    branches: [main, 'release-*']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # #1055: main pushes keep main-light and check the newest signed map.
  # Only a map older than 120 minutes admits the traced full plan and signing.
  # Nightly stays full and signs independently of the main-push age gate.
  push:
    branches: [main]
  # Full safety run on main, regardless of changed paths.
  schedule:
    - cron: '23 9 * * *' # 09:23 UTC every day
  # The merge queue (#190): GitHub re-tests each pull request on top of the
  # latest main just before it lands, in a merge group, and merges it only
  # if the required ci check passes there too. A merge group always runs
  # every job (decide.sh).
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  pull-requests: read # decide.sh reads the PR live
  id-token: write # cache.sh save: the token GitHub signs, which the PC's runner checks before it keeps a cache (#180)

# Event-specific groups keep scheduled and merge-group runs isolated.
# New main pushes cancel obsolete main-push work; PR updates keep cancelling
# only their own PR group (#1055).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  RUST_VERSION: 1.99.1
  NODE_VERSION: 24.22.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NEXT_TELEMETRY_DISABLED: 1
  CIRCLE_NODE_TOTAL: 2

jobs:

  changes:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_SMALL_RUNS_ON || vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      site: ${{ steps.plan.outputs.site }}
      site-in-release: ${{ steps.plan.outputs.site-in-release }}
      release: ${{ steps.plan.outputs.release }}
      skills: ${{ steps.plan.outputs.skills }}
      skill-jobs: ${{ steps.plan.outputs.skill-jobs }}
      build-web: ${{ steps.plan.outputs.build-web }}
      export-rust: ${{ steps.plan.outputs.export-rust }}
      export-web: ${{ steps.plan.outputs.export-web }}
      trace: ${{ steps.plan.outputs.trace }}
      planted: ${{ steps.plan.outputs.planted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - name: The PR test-code budget
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I tools/test-value/test_budget.py
          python3 -I tools/test-value/budget.py "--base=$BASE_SHA" "--head=$HEAD_SHA" "--event=$GITHUB_EVENT_PATH"
      # #2412: every path a change adds must be classified by the importer's
      # own rules (carriage list or private/retiring class); errors fail closed.
      - name: The carriage guard
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 -I tools/open-import/test_guard.py
          python3 -I tools/open-import/guard.py "--base=$BASE_SHA" --head=HEAD
      # #2531: check every PR before selection, without private literals.
      # #2819: always scans after the proofs; for a local proofs-only run,
      # set BASE_SHA=HEAD (an empty diff).
      # #2817: every refusal has its own proof, run through guard().
      # #2818: a pull_request scans from HEAD^1 (the merge ref's first parent);
      # BASE_SHA is the merge group's base.
      - name: The changed-file privacy guard
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          python3 -I - <<'PY'
          import contextlib
          import importlib.util
          import io
          import os
          from pathlib import Path
          import sys
          import tempfile
          import time

          sys.dont_write_bytecode = True
          sys.path.insert(0, str(Path('tools/privacy-check').resolve()))
          import check as privacy

          spec = importlib.util.spec_from_file_location('public_import', 'tools/open-import/import.py')
          importer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(importer)


          def scan(repo, base, head, private):
              checker = privacy.Checker()
              base, head = privacy.commit(repo, base), privacy.commit(repo, head)
              fork = privacy.git(repo, 'merge-base', base, head).decode().strip()
              records = privacy.git(repo, 'diff', '--raw', '--no-abbrev', '-z',
                                    '--no-renames', '--no-ext-diff', '--no-textconv', fork, head).split(b'\0')
              if records.pop() != b'' or len(records) % 2:
                  raise privacy.Unreadable()
              scanned = 0
              for metadata, raw_name in zip(records[::2], records[1::2]):
                  old_mode, mode, old_oid, oid, status = metadata.decode().split()
                  name = raw_name.decode('utf-8')
                  if status == 'D':
                      continue
                  if status not in {'A', 'M', 'T'} or mode not in {'100644', '100755', '120000'}:
                      raise privacy.Unreadable()
                  # Reuse the importer's classes; never read private/retired blobs here.
                  if private and importer.private_or_retired(name):
                      continue
                  place = 'changed:' + privacy.safe_place(name, ())
                  checker.file(name, privacy.git(repo, 'cat-file', 'blob', oid), place)
                  scanned += 1
              for target, place in checker.references:
                  privacy.git(repo, 'cat-file', '-e', head + ':' + target)
              print(f'changed-file privacy: scanned {scanned} files')
              return checker.findings


          def private_repository(name):
              return name.lower() == 'jparker2006/closedwiz'


          def guard(repo, head, environ):
              try:
                  # #2818: a PR's merge ref scans from its first parent, so files that
                  # reached main after base.sha stay out; a merge group keeps its base.
                  pull = environ.get('GITHUB_EVENT_NAME') == 'pull_request'
                  base = head + '^1' if pull else environ['BASE_SHA']
                  findings = scan(repo, base, head,
                                  private_repository(environ['GITHUB_REPOSITORY']))
                  print('literals: not used')
                  print(f'changed-file privacy: {time.monotonic() - started:.2f}s')
                  return int(bool(findings))
              except REFUSED:
                  print('READ changed-files:1')
                  return 1


          def proofs():
              planted = 'thr_' + 'planted2531'
              closed, public = 'jparker2006/ClosedWiz', 'openwizdev/OpenWiz'
              with tempfile.TemporaryDirectory() as folder:
                  repo = Path(folder)
                  def git(*args):
                      return privacy.git(repo, '-c', 'core.hooksPath=/dev/null',
                                         '-c', 'user.name=Synthetic',
                                         '-c', 'user.email=synthetic@example.invalid', *args)
                  def write(name, data):
                      path = repo / name
                      path.parent.mkdir(parents=True, exist_ok=True)
                      if isinstance(data, tuple):
                          operation, source = data
                          if operation == 'symlink':
                              path.symlink_to(source)
                          elif operation == 'rename':
                              (repo / source).rename(path)
                          elif operation == 'delete':
                              path.unlink()
                          elif operation == 'executable':
                              path.write_bytes(source)
                              path.chmod(0o755)
                          else:  # A gitlink naming a readable clean blob.
                              oid = git('rev-parse', 'HEAD:' + source).decode().strip()
                              git('update-index', '--add', '--cacheinfo', '160000,' + oid + ',' + name)
                              return False
                      else:
                          path.write_bytes(data)
                      return True
                  def commit(stage=True):
                      if stage:
                          git('add', '-A')
                      git('commit', '-qm', 'synthetic change')
                      return git('rev-parse', 'HEAD').decode().strip()
                  def check(label, head, repository, expected, seen, base, event='merge_group'):
                      out = io.StringIO()
                      with contextlib.redirect_stdout(out):
                          status = guard(repo, head, {'BASE_SHA': base, 'GITHUB_REPOSITORY': repository,
                                                      'GITHUB_EVENT_NAME': event})
                      scanned = [line for line in out.getvalue().splitlines() if ': scanned ' in line]
                      assert status == expected, label + ': wrong exit status ' + str(scanned)
                      assert seen in out.getvalue(), label + ': missing refusal ' + str(scanned)
                      assert planted not in out.getvalue(), label + ': source literal leaked'
                  git('init', '-q')
                  write('src/existing.txt', b'clean\n')
                  write('src/legacy.txt', planted.encode())
                  base = commit()
                  dangling = b'on: push\njobs:\n  call:\n    uses: ./.github/workflows/missing.yml\n'
                  cases = [
                      ('clean addition', closed, 'src/space and\nnewline.txt', b'clean\n', 0, 'scanned 1 files'),
                      ('executable addition', closed, 'src/run.sh', ('executable', b'clean\n'), 0, 'scanned 1 files'),
                      ('planted addition', closed, 'src/new.txt', planted.encode(), 1, 'T1 '),
                      ('planted modification', closed, 'src/existing.txt', planted.encode(), 1, 'T1 '),
                      ('planted filename', closed, 'src/' + planted, b'clean', 1, 'T1 '),
                      ('planted symlink', closed, 'src/link', ('symlink', planted), 1, 'T1 '),
                      ('deleted file', closed, 'src/legacy.txt', ('delete', None), 0, 'scanned 0 files'),
                      ('renamed planted content', closed, 'src/renamed.txt', ('rename', 'src/legacy.txt'), 1, 'T1 '),
                      ('private evidence', closed, 'private/notes.txt', planted.encode(), 0, 'scanned 0 files'),
                      ('public private/ file', public, 'private/notes.txt', b'clean\n', 1, 'F1 '),
                      ('binary addition', closed, 'src/image.png', b'\x89PNG\0synthetic', 0, 'scanned 1 files'),
                      ('unreadable encoding', closed, 'src/encoding.txt', b'\xffunknown', 1, 'READ changed:'),
                      ('dangling workflow reference', closed, '.github/workflows/call.yml', dangling, 1,
                       'READ changed-files:1'),
                      ('gitlink', closed, 'src/module', ('gitlink', 'src/existing.txt'), 1, 'READ changed-files:1'),
                  ]
                  for label, repository, name, data, expected, seen in cases:
                      git('checkout', '-q', '-B', 'candidate', base)
                      staged = write(name, data)
                      head = commit(staged)
                      # The Git blob must win over unstaged working-copy contents.
                      if staged and (repo / name).exists() and not (repo / name).is_symlink():
                          write(name, b'clean\n')
                      check(label, head, repository, expected, seen, base)
                      git('reset', '-q', '--hard')
                  # Git never reports an unknown status between commits, so plant one.
                  git('checkout', '-q', '-B', 'candidate', base)
                  write('src/new.txt', b'clean\n')
                  head = commit()
                  real = privacy.git
                  privacy.git = lambda where, *args: real(where, *args).replace(b' A\0', b' X\0')
                  try:
                      check('unknown status', head, closed, 1, 'READ changed-files:1', base)
                  finally:
                      privacy.git = real
                  check('missing base', 'HEAD', closed, 1, 'READ changed-files:1', '0' * 40)
                  # #2818: main moved after base.sha; GitHub's merge ref has main's tip as
                  # its first parent. Like #2808: 2 PR files, 3 main-only files.
                  git('checkout', '-q', '-B', 'pull', base)
                  for name in ('src/pr-one.txt', 'src/pr-two.txt'):
                      write(name, b'clean\n')
                  pull = commit()
                  git('checkout', '-q', '-B', 'main', base)
                  for name in ('src/main-one.txt', 'src/main-two.txt'):
                      write(name, b'clean\n')
                  write('src/main-planted.txt', planted.encode())
                  commit()
                  git('merge', '-q', '--no-ff', '-m', 'synthetic merge ref', pull)
                  merge = git('rev-parse', 'HEAD').decode().strip()
                  check('main moved, pull request', merge, closed, 0, 'scanned 2 files', base, 'pull_request')
                  check('main moved, merge group', merge, closed, 1, 'T1 ', base)
                  git('checkout', '-q', '--orphan', 'unrelated')
                  unrelated = commit()
                  check('no common ancestor, merge group', merge, closed, 1, 'READ changed-files:1', unrelated)
                  check('no first parent, pull request', unrelated, closed, 1, 'READ changed-files:1', base,
                        'pull_request')
              print('changed-file privacy proofs: passed')


          REFUSED = (KeyError, OSError, ValueError, UnicodeError, privacy.Unreadable, importer.Refused)
          started = time.monotonic()
          try:
              proofs()
          except REFUSED:
              print('READ changed-files:1')
              sys.exit(1)
          sys.exit(guard(Path('.'), 'HEAD', os.environ))
          PY
      - name: Restore the select-map cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/closedwiz-ci-select
          key: ci-select-map-none
          restore-keys: ci-select-map-
      # Restore uses the existing newest-cache lookup; only the signed iat is
      # age evidence. Unknown provenance/ancestry/age refuses this decision.
      - name: Check the signed main map age
        id: main_map
        if: github.event_name == 'push'
        run: |
          python3 -I - <<'PY_MAIN_MAP'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          sys.dont_write_bytecode = True
          sys.path.insert(0, str(Path('ci/select').resolve()))
          import job
          import pick

          try:
              folder = Path.home() / '.cache/closedwiz-ci-select'
              data = (folder / 'map.json').read_bytes()
              token = (folder / 'map.jwt').read_text().strip()
              now = time.time()
              claims = job.verify(data, token, job.fetch_jwks(), os.environ['GITHUB_REPOSITORY'], now=now)
              pick.check_map(pick.strict_json(data.decode('utf-8')))
              subprocess.run(['git', 'merge-base', '--is-ancestor', claims['sha'], 'HEAD'],
                             check=True, capture_output=True)
          except Exception as error:
              sys.exit(f'Main map age: unknown ({type(error).__name__}); refusing a trace decision')
          trace = now - claims['iat'] > 120 * 60
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'trace={str(trace).lower()}\n')
          print(f'Main signed map age: {now - claims["iat"]:.3f}s; trace={str(trace).lower()}')
          PY_MAIN_MAP
      - name: Write the CI plan
        id: plan
        if: github.event_name != 'push' || steps.main_map.outputs.trace == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/actions/docs-only/plan.py "$RUNNER_TEMP/ci-plan"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push' || steps.main_map.outputs.trace == 'true'
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan/*.json
          if-no-files-found: error
          retention-days: 30

  always:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name != 'push' || needs.changes.outputs.trace == 'true') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_RUST_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ needs.changes.outputs.planted == 'true' && 90 || needs.changes.outputs.trace == 'true' && 13 || 9 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Prune unused inputs
        run: sh .github/actions/docs-only/prune.sh .github/actions/docs-only/ci-reads.txt rust
      - name: Prepare lane
        uses: ./.github/actions/docs-only/setup
        with:
          hosted: ${{ steps.guard.outputs.hosted }}
          save: ${{ steps.guard.outputs.save }}
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cargo: 'true'
          npm: 'false'
          browser: 'false'
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      # #555: Prepare lane installed the pinned WizSkills; fail on any
      # carried contract that differs from it by one byte.
      - name: The WizSkills contract copies
        run: python3 -I tools/wizskills/check_contracts.py
      - name: The WizSkills installer's tests
        run: |
          python3 -I tools/wizskills/test_install.py
          python3 -I tools/wizskills/test_contract.py
      # #555: the fleet load checks moved out of launch-fleet (WZ4); their
      # slow load proof (tools/fleet-load/test.py) is not wired: see #555's Gaps.
      # #1208: the CI3 note's check, which read launch-fleet's removed helper,
      # smoke-run offline on this checkout (seconds; no step of its own, so
      # the CI3 step table is unchanged).
      - name: The fleet load checks
        run: |
          python3 -I tools/fleet-load/test_carried.py
          python3 -I tools/fleet-load/test_seams.py
          python3 -I tools/collector/test_ci3.py Smoke
      # #1419: the records v1 claim and lease model check and its broken
      # variants (seconds, offline). Folds into #1394's kit-tests step.
      - name: The records v1 claim and lease model
        run: |
          python3 -I kernel/records/model/test_model.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - name: Build and lint Rust
        run: python3 -I .github/actions/docs-only/run.py lint-always "$RUNNER_TEMP/ci-plan"
      - name: The always-run checks
        run: python3 -I .github/actions/docs-only/run.py execute "$RUNNER_TEMP/ci-plan" always
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.trace == 'true' || needs.changes.outputs.planted == 'true'
        with:
          name: select-records-always-${{ github.run_attempt }}
          path: ${{ runner.temp }}/select-records/*.json*
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the cargo-rust cache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        run: sh ci/runner/cache.sh save cargo-rust "$HOME/.cargo/registry" "$GITHUB_WORKSPACE/target"
      - name: Save the GitHub cargo-rust cache
        if: steps.guard.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path:  |
            ~/.cargo/registry
            target
          key: cargo-rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Record passed lane
        run: python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" always "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-always-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  web-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.build-web == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'jparker2006/ClosedWiz' && (vars.CI_WEB_RUNS_ON || 'namespace-profile-closedwiz-rust') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ needs.changes.outputs.planted == 'true' && 5 || needs.changes.outputs.trace == 'true' && 5 || 5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/private/
      - name: The runner guard
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: sh ci/hosted/guard.sh
      - name: Prune unused inputs
        run: sh .github/actions/docs-only/prune.sh .github/actions/docs-only/ci-reads.txt web-build
      - name: Prepare lane
        uses: ./.github/actions/docs-only/setup
        with:
          hosted: ${{ steps.guard.outputs.hosted }}
          save: ${{ steps.guard.outputs.save }}
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cargo: 'false'
          npm: 'true'
          browser: 'false'
      - name: Python for the offline installer and release proofs
        run: sh .github/actions/docs-only/python.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - name: Run npm run build
        run: python3 -I .github/actions/docs-only/run.py execute "$RUNNER_TEMP/ci-plan" build:web_export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-out
          path: apps/web/out
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.trace == 'true' || needs.changes.outputs.planted == 'true'
        with:
          name: select-records-web-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/select-records/*.json*
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the npm cache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        run: sh ci/runner/cache.sh save npm "$HOME/.npm"
      - name: Save the GitHub npm cache
        if: steps.guard.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Record passed lane
        run: python3 -I .github/actions/docs-only/run.py stamp "$RUNNER_TEMP/ci-plan" build:web_export "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-web-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  rust:
    needs: changes
