name: Daily install check
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-daily
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      version: ${{ steps.latest.outputs.version }}
      rehearsal: ${{ steps.latest.outputs.rehearsal }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: The latest published release
        id: latest
        run: |
          tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          version=${tag#v}
          python3 -c 'import re, sys; assert re.fullmatch(r"0\.[0-9]+\.[0-9]+", sys.argv[1])' "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest published release: $tag"
          if gh api "repos/$REPO/contents/tools/rehearsal/rehearse.py?ref=$tag" --silent 2>/dev/null; then
            echo "rehearsal=yes" >> "$GITHUB_OUTPUT"
          else
            echo "rehearsal=no" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag has no tools/rehearsal/rehearse.py, so there is nothing to rehearse; neutral, not red"
          fi
      - name: Download its assets
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: gh release download "$TAG" --repo "$REPO" --dir packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiz-release-${{ steps.latest.outputs.version }}
          path: packages/
          if-no-files-found: error
          retention-days: 7

  rehearse-linux:
    name: rehearse x86_64-unknown-linux-gnu
    needs: release
    if: needs.release.outputs.rehearsal == 'yes'
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Python 3, Git and CA certificates only
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 git ca-certificates
          for tool in cargo rustc rustup npm node npx; do
            if command -v "$tool"; then echo "the clean machine has $tool" >&2; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: The release's commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: The install skill at the wizskills.lock commit
        run: python3 -I tools/wizskills/install.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiz-release-${{ needs.release.outputs.version }}
          path: artifact
      - name: Rehearse the install
        run: |
          env -i PATH=/usr/bin:/bin python3 -I tools/rehearsal/rehearse.py --assets artifact --target "$TARGET" \
            --version "$VERSION" --source "$SOURCE" --checkout "$GITHUB_WORKSPACE" \
            --skills "$GITHUB_WORKSPACE/.wizskills/skills" --output rehearsal.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openwiz-daily-rehearsal-${{ needs.release.outputs.version }}-x86_64-unknown-linux-gnu
          path: rehearsal.json
          if-no-files-found: warn
          retention-days: 7
  rehearse-macos:
    name: rehearse ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.rehearsal == 'yes'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: The release's commit
        run: |
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: The install skill at the wizskills.lock commit
        run: /usr/bin/python3 -I tools/wizskills/install.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiz-release-${{ needs.release.outputs.version }}
          path: artifact
      - name: Rehearse the install
        run: |
          mkdir -m 700 "$RUNNER_TEMP/stranger-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/stranger-home" /usr/bin/python3 -I tools/rehearsal/rehearse.py \
            --assets "$GITHUB_WORKSPACE/artifact" --target "$TARGET" \
            --version "$VERSION" --source "$SOURCE" --checkout "$GITHUB_WORKSPACE" \
            --skills "$GITHUB_WORKSPACE/.wizskills/skills" --output rehearsal.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openwiz-daily-rehearsal-${{ needs.release.outputs.version }}-${{ matrix.target }}
          path: rehearsal.json
          if-no-files-found: warn
          retention-days: 7

  track:
    needs: [release, rehearse-linux, rehearse-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      REHEARSAL: ${{ needs.release.outputs.rehearsal }}
      RELEASE: ${{ needs.release.result }}
      LINUX: ${{ needs.rehearse-linux.result }}
      MACOS: ${{ needs.rehearse-macos.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, comment on or close the one tracking issue
        run: |
          python3 -I tools/rehearsal/daily.py \
            --repo "$REPO" \
            --tag "$TAG" \
            --run "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release "$RELEASE" \
            --rehearsal "$REHEARSAL" \
            --linux "$LINUX" \
            --macos "$MACOS"
