# #2931: ClosedWiz's frozen old code check, in its own small workflow, so it
# stays on after the cut-over: runbook step 7 keeps it enabled while the rest of
# ClosedWiz's CI stops, and the ruleset then requires only this check. Off until
# CLOSEDWIZ_FROZEN_SINCE holds the switch date; #1287's deletion, named by title
# or queue ref, is excepted.
#
# R1: the change never supplies the checker. pull_request_target runs this file
# as it is on main, and every step runs main's tools from .frozen-tools (a merge
# group uses its base);
# the change is checked out only as Git data in candidate/, never run, with no
# credentials kept. A merge group's PRs already passed this base-run check, and
# it refuses any change to this file or the tools, which are frozen paths.
name: Frozen old code

on:
  pull_request_target:
    branches: [main]
    # edited: a title change can add or remove #1287's exception.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: frozen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen:
    # Fixed ruleset status name: frozen. Never a variable.
    name: frozen
    # GitHub-hosted only: it must outlive ClosedWiz's released runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Current main's tools, even when the PR's base predates this check.
      # A merge group uses its base. Never run tools supplied by the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha || 'main' }}
          path: .frozen-tools
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/open-import/
            /.github/workflows/frozen.yml
      # The change, as data only: full commit and tree history, no blobs beyond
      # the list. Nothing in it is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/open-import/paths.json
      # The list is judged at the base. When the change edits it, the base's
      # blob is not in the blobless clone and lazy fetch is off: add main's
      # copy by content. Only that exact blob can satisfy the check's read.
      - name: The base's carriage list
        run: git -C candidate hash-object -w --no-filters "$PWD/.frozen-tools/tools/open-import/paths.json"
      - name: The frozen old code check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          FROZEN_SINCE: ${{ vars.CLOSEDWIZ_FROZEN_SINCE }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          python3 -I .frozen-tools/tools/open-import/test_frozen.py
          python3 -I .frozen-tools/tools/open-import/frozen.py --repo=candidate "--base=$BASE_SHA" "--head=$HEAD_SHA"
