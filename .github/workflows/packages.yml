name: Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed pre-release version (0.minor.patch)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      OPENWIZ_SERVICE_BUILD: ${{ github.sha }}
      CARGO_BUILD_JOBS: 2
      CIRCLE_NODE_TOTAL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', os.environ['VERSION'])
          PY
      - name: Native Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update && rustup default 1.99.1
      - name: Install pinned Zig and cargo-zigbuild
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        run: |
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              zig_arch=x86_64-linux
              zig_sha=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
              czb_sha=32581c8e13f27a807bb244aaaac870522f5b51263c766cf77b1a99771ce9fa5c
              ;;
            aarch64-unknown-linux-gnu)
              zig_arch=aarch64-linux
              zig_sha=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
              czb_sha=70bb4c9cc71a6d16211b9079996e3cd588671053312adeff4d043499ed887601
              ;;
            *) echo "unsupported Linux target: $TARGET" >&2; exit 1 ;;
          esac
          tools="$RUNNER_TEMP/zigbuild"
          mkdir -p "$tools/zig" "$tools/bin"
          curl -fsSL --retry 3 -o "$tools/zig.tar.xz" \
            "https://ziglang.org/download/0.17.1/zig-${zig_arch}-0.17.1.tar.xz"
          echo "$zig_sha  $tools/zig.tar.xz" | sha256sum -c -
          tar -xJf "$tools/zig.tar.xz" -C "$tools/zig" --strip-components=1
          curl -fsSL --retry 3 -o "$tools/cargo-zigbuild.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1/cargo-zigbuild-${TARGET}.tar.xz"
          echo "$czb_sha  $tools/cargo-zigbuild.tar.xz" | sha256sum -c -
          tar -xJf "$tools/cargo-zigbuild.tar.xz" -C "$tools/bin" --strip-components=1
          echo "$tools/zig" >> "$GITHUB_PATH"
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Build the matching program
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text()
          old = '[workspace.package]\nversion = "0.0.1-dev"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '[workspace.package]\nversion = "' + os.environ['VERSION'] + '"'))
          lock = Path('Cargo.lock')
          blocks = lock.read_text().split('[[package]]')
          for at in range(1, len(blocks)):
              if '\nsource = ' not in blocks[at]:
                  blocks[at] = blocks[at].replace('\nversion = "0.0.1-dev"\n', '\nversion = "' + os.environ['VERSION'] + '"\n', 1)
          lock.write_text('[[package]]'.join(blocks))
          PY
          case "$TARGET" in
            *-unknown-linux-gnu)
              cargo zigbuild --release --locked --target "${TARGET}.2.34" -p openwiz-cli ;;
            *)
              cargo build --release --locked --target "$TARGET" -p openwiz-cli ;;
          esac
      - name: Check Linux glibc version ceiling
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        run: python3 -I tools/release/check_glibc.py --binary "target/$TARGET/release/openwiz" --max 2.34
      - name: Query the native programs' compiled identity
        run: python3 tools/release/product_identity.py query --binaries "target/$TARGET/release" --target "$TARGET" --output program-receipt.json
      - name: The pinned WizSkills
        run: python3 -I tools/wizskills/install.py
      - name: Record and assemble exact products
        run: |
          python3 tools/release/build_products.py --root "$GITHUB_WORKSPACE" \
            --binaries "target/$TARGET/release" --output products \
            --version "$VERSION" --source "$GITHUB_SHA" --target "$TARGET" --identity products.json \
            --program-receipt program-receipt.json --record product-record.json
          python3 tools/release/package.py --products products --identity products.json --output packages
          python3 tools/release/product_identity.py artifacts --identity products.json --packages packages --output artifacts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiz-${{ inputs.version }}-${{ matrix.target }}
          path: |
            packages/
            products.json
            program-receipt.json
            product-record.json
            artifacts.json
          if-no-files-found: error
          retention-days: 7
