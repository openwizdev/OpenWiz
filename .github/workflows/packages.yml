# Manual artifact assembly only. No release, tag, push, credentials or publication.
name: Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed pre-release version (0.minor.patch)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      OPENWIZ_SERVICE_BUILD: ${{ github.sha }}
      CARGO_BUILD_JOBS: 2
      CIRCLE_NODE_TOTAL: 2
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', os.environ['VERSION'])
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Native Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update && rustup default 1.99.1
      - name: Build the matching web export
        working-directory: apps/web
        env:
          OPENWIZ_BUILD_VERSION: ${{ inputs.version }}
          OPENWIZ_BUILD_TARGET: ${{ matrix.target }}
        run: npm ci --ignore-scripts && npm run build
      - name: Record the web build receipt
        run: python3 tools/release/product_identity.py web --web apps/web/out --output web-receipt.json
      - name: Build the three matching programs
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text()
          old = '[workspace.package]\nversion = "0.0.1-dev"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '[workspace.package]\nversion = "' + os.environ['VERSION'] + '"'))
          lock = Path('Cargo.lock')
          blocks = lock.read_text().split('[[package]]')
          for at in range(1, len(blocks)):
              if '\nsource = ' not in blocks[at]:
                  blocks[at] = blocks[at].replace('\nversion = "0.0.1-dev"\n', '\nversion = "' + os.environ['VERSION'] + '"\n', 1)
          lock.write_text('[[package]]'.join(blocks))
          PY
          cargo build --release --locked --target "$TARGET" -p openwiz-cli -p openwiz-service -p openwiz-server
          "target/$TARGET/release/openwiz-service" --update-build > compiled-source.txt
          test "$(cat compiled-source.txt)" = "$GITHUB_SHA"
      - name: Query the native programs' compiled identity
        run: python3 tools/release/product_identity.py query --binaries "target/$TARGET/release" --target "$TARGET" --output program-receipt.json
      - name: Record and assemble exact products
        run: |
          python3 tools/release/build_products.py --root "$GITHUB_WORKSPACE" \
            --binaries "target/$TARGET/release" --web apps/web/out --output products \
            --version "$VERSION" --source "$GITHUB_SHA" --target "$TARGET" --identity products.json \
            --program-receipt program-receipt.json --web-receipt web-receipt.json --record product-record.json
          python3 tools/release/package.py --products products --identity products.json --output packages
          python3 tools/release/product_identity.py artifacts --identity products.json --packages packages --output artifacts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiz-${{ inputs.version }}-${{ matrix.target }}
          path: |
            packages/
            products.json
            program-receipt.json
            web-receipt.json
            product-record.json
            artifacts.json
          if-no-files-found: error
          retention-days: 7
