name: Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed pre-release version (0.minor.patch)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      OPENWIZ_SERVICE_BUILD: ${{ github.sha }}
      CARGO_BUILD_JOBS: 2
      CIRCLE_NODE_TOTAL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', os.environ['VERSION'])
          PY
      - name: Native Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update && rustup default 1.99.1
      - name: Build the matching program
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text()
          old = '[workspace.package]\nversion = "0.0.1-dev"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '[workspace.package]\nversion = "' + os.environ['VERSION'] + '"'))
          lock = Path('Cargo.lock')
          blocks = lock.read_text().split('[[package]]')
          for at in range(1, len(blocks)):
              if '\nsource = ' not in blocks[at]:
                  blocks[at] = blocks[at].replace('\nversion = "0.0.1-dev"\n', '\nversion = "' + os.environ['VERSION'] + '"\n', 1)
          lock.write_text('[[package]]'.join(blocks))
          PY
          cargo build --release --locked --target "$TARGET" -p openwiz-cli
      - name: Query the native programs' compiled identity
        run: python3 tools/release/product_identity.py query --binaries "target/$TARGET/release" --target "$TARGET" --output program-receipt.json
      - name: The pinned WizSkills
        run: python3 -I tools/wizskills/install.py
      - name: Record and assemble exact products
        run: |
          python3 tools/release/build_products.py --root "$GITHUB_WORKSPACE" \
            --binaries "target/$TARGET/release" --output products \
            --version "$VERSION" --source "$GITHUB_SHA" --target "$TARGET" --identity products.json \
            --program-receipt program-receipt.json --record product-record.json
          python3 tools/release/package.py --products products --identity products.json --output packages
          python3 tools/release/product_identity.py artifacts --identity products.json --packages packages --output artifacts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiz-${{ inputs.version }}-${{ matrix.target }}
          path: |
            packages/
            products.json
            program-receipt.json
            product-record.json
            artifacts.json
          if-no-files-found: error
          retention-days: 7

  rehearse-linux:
    needs: package
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Python 3, Git and CA certificates only
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 git ca-certificates
          for tool in cargo rustc rustup npm node npx; do
            if command -v "$tool"; then echo "the clean machine has $tool" >&2; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The install skill at the wizskills.lock commit
        run: python3 -I tools/wizskills/install.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiz-${{ inputs.version }}-x86_64-unknown-linux-gnu
          path: artifact
      - name: Rehearse the install
        run: |
          env -i PATH=/usr/bin:/bin python3 -I tools/rehearsal/rehearse.py --assets artifact/packages --target "$TARGET" \
            --version "$VERSION" --source "$GITHUB_SHA" --checkout "$GITHUB_WORKSPACE" \
            --skills "$GITHUB_WORKSPACE/.wizskills/skills" --output rehearsal.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openwiz-rehearsal-${{ inputs.version }}-x86_64-unknown-linux-gnu
          path: rehearsal.json
          if-no-files-found: error
          retention-days: 7
  rehearse-macos:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The install skill at the wizskills.lock commit
        run: /usr/bin/python3 -I tools/wizskills/install.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiz-${{ inputs.version }}-${{ matrix.target }}
          path: artifact
      - name: Rehearse the install
        run: |
          mkdir -m 700 "$RUNNER_TEMP/stranger-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/stranger-home" /usr/bin/python3 -I tools/rehearsal/rehearse.py \
            --assets "$GITHUB_WORKSPACE/artifact/packages" --target "$TARGET" \
            --version "$VERSION" --source "$GITHUB_SHA" --checkout "$GITHUB_WORKSPACE" \
            --skills "$GITHUB_WORKSPACE/.wizskills/skills" --output rehearsal.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openwiz-rehearsal-${{ inputs.version }}-${{ matrix.target }}
          path: rehearsal.json
          if-no-files-found: error
          retention-days: 7
      - name: The runner's fixture suite on macOS
        run: |
          mkdir -m 700 "$RUNNER_TEMP/suite-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/suite-home" /usr/bin/python3 -I tools/rehearsal/test_rehearse.py
  rehearsal:
    needs: [rehearse-linux, rehearse-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every rehearse job passed
        env:
          LINUX: ${{ needs.rehearse-linux.result }}
          MACOS: ${{ needs.rehearse-macos.result }}
        run: |
          echo "rehearse-linux: $LINUX"
          echo "rehearse-macos: $MACOS"
          test "$LINUX" = success
          test "$MACOS" = success
