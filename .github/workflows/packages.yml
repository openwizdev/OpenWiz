name: Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed pre-release version (0.minor.patch)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      OPENWIZ_SERVICE_BUILD: ${{ github.sha }}
      CARGO_BUILD_JOBS: 2
      CIRCLE_NODE_TOTAL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', os.environ['VERSION'])
          PY
      - name: Native Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update && rustup default 1.99.1
      - name: Build the matching program
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text()
          old = '[workspace.package]\nversion = "0.0.1-dev"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '[workspace.package]\nversion = "' + os.environ['VERSION'] + '"'))
          lock = Path('Cargo.lock')
          blocks = lock.read_text().split('[[package]]')
          for at in range(1, len(blocks)):
              if '\nsource = ' not in blocks[at]:
                  blocks[at] = blocks[at].replace('\nversion = "0.0.1-dev"\n', '\nversion = "' + os.environ['VERSION'] + '"\n', 1)
          lock.write_text('[[package]]'.join(blocks))
          PY
          cargo build --release --locked --target "$TARGET" -p openwiz-cli
      - name: Query the native programs' compiled identity
        run: python3 tools/release/product_identity.py query --binaries "target/$TARGET/release" --target "$TARGET" --output program-receipt.json
      - name: The pinned WizSkills
        run: python3 -I tools/wizskills/install.py
      - name: Record and assemble exact products
        run: |
          python3 tools/release/build_products.py --root "$GITHUB_WORKSPACE" \
            --binaries "target/$TARGET/release" --output products \
            --version "$VERSION" --source "$GITHUB_SHA" --target "$TARGET" --identity products.json \
            --program-receipt program-receipt.json --record product-record.json
          python3 tools/release/package.py --products products --identity products.json --output packages
          python3 tools/release/product_identity.py artifacts --identity products.json --packages packages --output artifacts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiz-${{ inputs.version }}-${{ matrix.target }}
          path: |
            packages/
            products.json
            program-receipt.json
            product-record.json
            artifacts.json
          if-no-files-found: error
          retention-days: 7
